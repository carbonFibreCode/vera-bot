[project]
name = "vera-bot"
version = "1.0.0"
description = "Merchant engagement bot for the magicpin Vera challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["magicpin-ai-challenge"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/vera"]

[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
